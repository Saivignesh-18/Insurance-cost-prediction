<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insurance Cost Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f5f0;
      --surface:  #ffffff;
      --border:   #e2e2dc;
      --text:     #1a1a1a;
      --muted:    #6b6b6b;
      --accent:   #185FA5;
      --accent-bg:#E6F1FB;
      --success:  #0F6E56;
      --warn:     #BA7517;
      --danger:   #993C1D;
      --radius:   12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .page { max-width: 760px; margin: 0 auto; }

    header { margin-bottom: 2rem; }
    header h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
    header p  { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      padding: 3px 10px; border-radius: 20px;
      background: var(--accent-bg); color: var(--accent);
      margin-top: 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 12px;
    }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }

    .slider-wrap .val-badge {
      font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 10px; display: block;
    }
    input[type=range] {
      width: 100%; height: 4px; accent-color: var(--accent); cursor: pointer;
    }

    .toggle-row { display: flex; gap: 8px; }
    .tb {
      flex: 1; padding: 9px 8px; font-size: 13px; font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; color: var(--muted); cursor: pointer; transition: all .15s;
    }
    .tb:hover { background: var(--bg); }
    .tb.on {
      background: var(--accent-bg); color: var(--accent);
      border-color: var(--accent); font-weight: 500;
    }

    .reg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

    .predict-btn {
      width: 100%; padding: 15px; font-size: 15px; font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); cursor: pointer; transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 4px;
    }
    .predict-btn:hover  { background: #0e4d8a; }
    .predict-btn:active { transform: scale(0.99); }
    .predict-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .result-card {
      background: var(--surface); border: 2px solid var(--accent);
      border-radius: var(--radius); padding: 1.5rem; margin-top: 16px;
      animation: fadeIn .35s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

    .result-label  { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    .result-amount { font-size: 44px; font-weight: 600; color: var(--accent); letter-spacing: -1.5px; }
    .result-sub    { font-size: 14px; color: var(--muted); margin-top: 4px; }

    .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
    .metric   { background: var(--bg); border-radius: 8px; padding: 12px; }
    .metric .m-lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .metric .m-val { font-size: 16px; font-weight: 600; color: var(--text); }

    .breakdown {
      margin-top: 16px; padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .breakdown-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .factor-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .factor-name { font-size: 13px; color: var(--muted); width: 110px; flex-shrink: 0; }
    .bar-track { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .6s ease; }
    .factor-amt { font-size: 12px; color: var(--muted); width: 52px; text-align: right; font-family: 'DM Mono', monospace; }

    .tip-box {
      margin-top: 14px; padding: 12px 14px;
      background: #EAF3DE; border-radius: 8px;
      font-size: 13px; color: #3B6D11; line-height: 1.6;
    }
    .tip-box b { color: #27500A; }

    .error-box {
      background: #FAECE7; border: 1px solid #F0997B;
      border-radius: 8px; padding: 12px; margin-top: 12px;
      font-size: 13px; color: #712B13;
    }

    .spinner {
      width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }

    .section-title {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px;
    }

    @media (max-width: 540px) {
      .grid2 { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="page">

  <header>
    <h1>Insurance Cost Predictor</h1>
    <p>Linear Regression model — enter your details for an accurate premium estimate</p>
    <span class="badge">ML Model: Linear Regression &nbsp;|&nbsp; Backend: Python Flask</span>
  </header>

  <!-- Inputs -->
  <div class="grid2">
    <div class="card slider-wrap">
      <label>Age</label>
      <span class="val-badge" id="age-val">32 yrs</span>
      <input type="range" id="age" min="18" max="80" value="32" step="1"
             oninput="document.getElementById('age-val').textContent=this.value+' yrs'">
    </div>
    <div class="card slider-wrap">
      <label>BMI</label>
      <span class="val-badge" id="bmi-val">25.0</span>
      <input type="range" id="bmi" min="15" max="50" value="25" step="0.5"
             oninput="document.getElementById('bmi-val').textContent=parseFloat(this.value).toFixed(1)">
    </div>
  </div>

  <div class="grid2">
    <div class="card slider-wrap">
      <label>Number of children</label>
      <span class="val-badge" id="ch-val">1</span>
      <input type="range" id="children" min="0" max="5" value="1" step="1"
             oninput="document.getElementById('ch-val').textContent=this.value">
    </div>
    <div class="card">
      <label>Sex</label>
      <div class="toggle-row">
        <button class="tb on" id="sx-m" onclick="setSex('male')">Male</button>
        <button class="tb"    id="sx-f" onclick="setSex('female')">Female</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <label>Smoking status</label>
    <div class="toggle-row">
      <button class="tb on" id="sm-no"  onclick="setSmoke('no')">Non-smoker</button>
      <button class="tb"    id="sm-yes" onclick="setSmoke('yes')">Smoker</button>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <label>Region</label>
    <div class="reg-grid">
      <button class="tb on" id="r-ne" onclick="setRegion('northeast')">Northeast</button>
      <button class="tb"    id="r-se" onclick="setRegion('southeast')">Southeast</button>
      <button class="tb"    id="r-nw" onclick="setRegion('northwest')">Northwest</button>
      <button class="tb"    id="r-sw" onclick="setRegion('southwest')">Southwest</button>
    </div>
  </div>

  <button class="predict-btn" id="pred-btn" onclick="predict()">
    &#x2728; Predict Insurance Cost
  </button>

  <div id="result-area"></div>

</div><!-- .page -->

<script>
  let sex = 'male', smoke = 'no', region = 'northeast';

  function setSex(v)    { sex=v;    toggle('sx-m','sx-f',v==='male'); }
  function setSmoke(v)  { smoke=v;  toggle('sm-no','sm-yes',v==='no'); }
  function setRegion(v) {
    region=v;
    ['ne','se','nw','sw'].forEach(r=>{
      const map={ne:'northeast',se:'southeast',nw:'northwest',sw:'southwest'};
      document.getElementById('r-'+r).className='tb'+(map[r]===v?' on':'');
    });
  }
  function toggle(a, b, firstOn) {
    document.getElementById(a).className='tb'+(firstOn?' on':'');
    document.getElementById(b).className='tb'+(!firstOn?' on':'');
  }

  function getRiskColor(risk) {
    const map = { Low:'#0F6E56', Medium:'#BA7517', High:'#993C1D', 'Very High':'#A32D2D' };
    return map[risk] || '#6b6b6b';
  }

  function factorBars(annual) {
    const age      = parseInt(document.getElementById('age').value);
    const bmi      = parseFloat(document.getElementById('bmi').value);
    const children = parseInt(document.getElementById('children').value);
    const isObese  = bmi >= 30;
    const isSmoker = smoke === 'yes';

    const parts = [
      { name: 'Age',      val: Math.max(0, Math.round(age * 256)) },
      { name: 'BMI',      val: Math.max(0, Math.round(bmi * 332)) },
      { name: 'Smoking',  val: isSmoker ? Math.round(23848 + (isObese ? bmi*13.4 : 0)) : 0 },
      { name: 'Children', val: Math.max(0, children * 476) },
    ].filter(p => p.val > 0);

    const max = Math.max(...parts.map(p => p.val), 1);
    return `
      <div class="breakdown">
        <div class="breakdown-title">Factor contribution</div>
        ${parts.map(p => `
          <div class="factor-row">
            <span class="factor-name">${p.name}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(p.val/max*100)}%"></div></div>
            <span class="factor-amt">$${p.val >= 1000 ? (p.val/1000).toFixed(1)+'k' : p.val}</span>
          </div>`).join('')}
      </div>`;
  }

  async function predict() {
    const btn = document.getElementById('pred-btn');
    const ra  = document.getElementById('result-area');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Calculating...';
    ra.innerHTML  = '';

    const payload = {
      age:      parseInt(document.getElementById('age').value),
      bmi:      parseFloat(document.getElementById('bmi').value),
      children: parseInt(document.getElementById('children').value),
      sex, smoker: smoke, region
    };

    try {
      const resp = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();

      if (data.error) throw new Error(data.error);

      const rc = getRiskColor(data.risk_level);
      ra.innerHTML = `
        <div class="result-card">
          <div class="result-label">Estimated annual premium</div>
          <div class="result-amount">$${data.annual_cost.toLocaleString()}</div>
          <div class="result-sub">Predicted by Linear Regression model</div>
          <div class="metrics">
            <div class="metric"><div class="m-lbl">Monthly</div><div class="m-val">$${data.monthly_cost.toLocaleString()}</div></div>
            <div class="metric"><div class="m-lbl">Risk level</div><div class="m-val" style="color:${rc}">${data.risk_level}</div></div>
            <div class="metric"><div class="m-lbl">BMI category</div><div class="m-val">${data.bmi_category}</div></div>
          </div>
          ${factorBars(data.annual_cost)}
          <div class="tip-box">
            <b>Tip:</b>
            ${data.inputs.smoker === 'yes'
              ? 'Quitting smoking is the single biggest step to reduce your insurance cost — it can cut your premium by 50–70%.'
              : data.bmi_category === 'Obese'
                ? 'Reducing BMI below 30 can significantly lower your premium, especially combined with not smoking.'
                : 'Your profile has a relatively low-risk baseline. Maintaining a healthy BMI keeps costs down.'}
          </div>
        </div>`;
    } catch (err) {
      ra.innerHTML = `<div class="error-box"><b>Error:</b> ${err.message}</div>`;
    }

    btn.disabled = false;
    btn.innerHTML = '&#x2728; Predict Again';
  }
</script>
</body>
</html>
